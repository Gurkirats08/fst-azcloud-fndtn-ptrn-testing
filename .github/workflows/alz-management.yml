name: ALZ Management Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Environment'
        required: true
        default: 'NonProduction'
        type: choice
        options:
          - NonProduction
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      expected_subscription_id:
        description: 'Expected Azure Subscription ID for safety validation'
        required: false
        type: string

env:
  TERRAFORM_VERSION: "1.6.0"
  TF_INPUT: false
  TF_IN_AUTOMATION: true

jobs:
  terraform-plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: management
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup SSH for Private Module Access
        env:
          MODULES_REPO_SSH_PRIVATE_KEY: ${{ secrets.MODULES_REPO_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$MODULES_REPO_SSH_PRIVATE_KEY" ]; then
            echo "Missing required secret MODULES_REPO_SSH_PRIVATE_KEY in this GitHub Environment."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$MODULES_REPO_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Validate Requested Subscription ID
        if: ${{ github.event.inputs.expected_subscription_id != '' }}
        run: |
          REQUESTED_SUBSCRIPTION_ID="${{ github.event.inputs.expected_subscription_id }}"
          ACTUAL_SUBSCRIPTION_ID="${{ secrets.ARM_SUBSCRIPTION_ID }}"

          if [ "${REQUESTED_SUBSCRIPTION_ID,,}" != "${ACTUAL_SUBSCRIPTION_ID,,}" ]; then
            echo "Requested subscription ID does not match management workflow subscription ID."
            echo "Requested: ${REQUESTED_SUBSCRIPTION_ID}"
            echo "Actual: ${ACTUAL_SUBSCRIPTION_ID}"
            exit 1
          fi

      - name: Bootstrap - Create Storage Account and Blob Container
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          TFVARS="./alz-platform/pattern1/management/backend.tfvars"
          RESOURCE_GROUP=$(awk -F '"' '/resource_group_name/ {print $2}' "$TFVARS")
          STORAGE_ACCOUNT=$(awk -F '"' '/storage_account_name/ {print $2}' "$TFVARS")
          CONTAINER=$(awk -F '"' '/container_name/ {print $2}' "$TFVARS")
          LOCATION=$(az group show --name "$RESOURCE_GROUP" --query location -o tsv)
          echo "Bootstrapping: $STORAGE_ACCOUNT/$CONTAINER in $RESOURCE_GROUP ($LOCATION)"
          if ! az storage account show --name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" --only-show-errors &>/dev/null; then
            az storage account create \
              --name "$STORAGE_ACCOUNT" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$LOCATION" \
              --sku Standard_LRS \
              --kind StorageV2 \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false \
              --only-show-errors
          else
            echo "Storage account $STORAGE_ACCOUNT already exists, skipping."
          fi
          if ! az storage container show --name "$CONTAINER" --account-name "$STORAGE_ACCOUNT" --auth-mode login --only-show-errors &>/dev/null; then
            az storage container create \
              --name "$CONTAINER" \
              --account-name "$STORAGE_ACCOUNT" \
              --auth-mode login \
              --only-show-errors
          else
            echo "Blob container $CONTAINER already exists, skipping."
          fi

      - name: Bootstrap - Grant Storage Blob Data Contributor to SPN
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          TFVARS="./alz-platform/pattern1/management/backend.tfvars"
          RESOURCE_GROUP=$(awk -F '"' '/resource_group_name/ {print $2}' "$TFVARS")
          STORAGE_ACCOUNT=$(awk -F '"' '/storage_account_name/ {print $2}' "$TFVARS")
          STORAGE_ID=$(az storage account show \
            --name "$STORAGE_ACCOUNT" \
            --resource-group "$RESOURCE_GROUP" \
            --query id -o tsv)
          SP_OBJECT_ID=$(az ad sp show --id "$ARM_CLIENT_ID" --query id -o tsv)
          if [ -z "$SP_OBJECT_ID" ]; then
            echo "ERROR: Could not resolve Service Principal object ID for client ID: $ARM_CLIENT_ID"
            exit 1
          fi
          EXISTING=$(az role assignment list \
            --assignee "$SP_OBJECT_ID" \
            --role "Storage Blob Data Contributor" \
            --scope "$STORAGE_ID" \
            --query "[].id" -o tsv 2>/dev/null)
          if [ -z "$EXISTING" ]; then
            echo "Granting Storage Blob Data Contributor on: $STORAGE_ID"
            az role assignment create \
              --assignee-object-id "$SP_OBJECT_ID" \
              --assignee-principal-type ServicePrincipal \
              --role "Storage Blob Data Contributor" \
              --scope "$STORAGE_ID" \
              --only-show-errors
            echo "Waiting 120s for RBAC propagation..."
            sleep 120
          else
            echo "Storage Blob Data Contributor already assigned, skipping."
          fi

      - name: Bootstrap - Create Key Vault
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          TFVARS="./alz-platform/pattern1/management/backend.tfvars"
          RESOURCE_GROUP=$(awk -F '"' '/resource_group_name/ {print $2}' "$TFVARS")
          STORAGE_ACCOUNT=$(awk -F '"' '/storage_account_name/ {print $2}' "$TFVARS")
          LOCATION=$(az group show --name "$RESOURCE_GROUP" --query location -o tsv)
          KV_NAME="kv-$(echo "$STORAGE_ACCOUNT" | cut -c1-21)"
          echo "Creating Key Vault: $KV_NAME in $RESOURCE_GROUP ($LOCATION)"
          if ! az keyvault show --name "$KV_NAME" --resource-group "$RESOURCE_GROUP" --only-show-errors &>/dev/null; then
            az keyvault create \
              --name "$KV_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$LOCATION" \
              --enable-rbac-authorization true \
              --only-show-errors
          else
            echo "Key Vault $KV_NAME already exists, skipping."
          fi

      - name: Bootstrap - Grant Key Vault Secrets Officer to SPN
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          TFVARS="./alz-platform/pattern1/management/backend.tfvars"
          RESOURCE_GROUP=$(awk -F '"' '/resource_group_name/ {print $2}' "$TFVARS")
          STORAGE_ACCOUNT=$(awk -F '"' '/storage_account_name/ {print $2}' "$TFVARS")
          KV_NAME="kv-$(echo "$STORAGE_ACCOUNT" | cut -c1-21)"
          KV_ID=$(az keyvault show \
            --name "$KV_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query id -o tsv)
          SP_OBJECT_ID=$(az ad sp show --id "$ARM_CLIENT_ID" --query id -o tsv)
          if [ -z "$SP_OBJECT_ID" ]; then
            echo "ERROR: Could not resolve Service Principal object ID for client ID: $ARM_CLIENT_ID"
            exit 1
          fi
          EXISTING=$(az role assignment list \
            --assignee "$SP_OBJECT_ID" \
            --role "Key Vault Secrets Officer" \
            --scope "$KV_ID" \
            --query "[].id" -o tsv 2>/dev/null)
          if [ -z "$EXISTING" ]; then
            echo "Granting Key Vault Secrets Officer on: $KV_ID"
            az role assignment create \
              --assignee-object-id "$SP_OBJECT_ID" \
              --assignee-principal-type ServicePrincipal \
              --role "Key Vault Secrets Officer" \
              --scope "$KV_ID" \
              --only-show-errors
          else
            echo "Key Vault Secrets Officer already assigned, skipping."
          fi

      - name: Terraform Init
        working-directory: ./alz-platform/pattern1/management
        env:
          ARM_USE_OIDC: true
          ARM_OIDC_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ARM_OIDC_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
        run: terraform init -backend-config="backend.tfvars"

      - name: Terraform Format
        working-directory: ./alz-platform/pattern1/management
        continue-on-error: true
        run: terraform fmt -recursive

      - name: Terraform Validate
        working-directory: ./alz-platform/pattern1/management
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./alz-platform/pattern1/management
        timeout-minutes: 30
        env:
          ARM_USE_OIDC: true
          ARM_OIDC_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ARM_OIDC_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
        run: |
          TFVARS_FILE="${{ github.workspace }}/alz-platform/pattern1/management/management.tfvars"

          if [ ! -f "$TFVARS_FILE" ]; then
            echo "❌ tfvars file not found: $TFVARS_FILE"
            exit 1
          fi

          echo "Using tfvars file: $TFVARS_FILE"

          MAX_RETRIES=3
          RETRY=0
          while [ $RETRY -lt $MAX_RETRIES ]; do
            echo "Terraform plan attempt $((RETRY + 1))/$MAX_RETRIES"
            terraform plan \
              -var-file="$TFVARS_FILE" \
              -out=tfplan-management && break
            RETRY=$((RETRY + 1))
            if [ $RETRY -lt $MAX_RETRIES ]; then
              echo "Plan failed, waiting 30 seconds before retry..."
              sleep 30
            fi
          done

          if [ $RETRY -eq $MAX_RETRIES ]; then
            echo "❌ Failed to acquire state lock after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-management
          path: ./alz-platform/pattern1/management/tfplan-management
          retention-days: 7

  approval:
    needs: terraform-plan
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy'
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - name: Approval Checkpoint
        run: |
          echo "✅ Approval granted for management deployment to ${{ github.event.inputs.environment }}"

  terraform-apply:
    needs: approval
    runs-on: ubuntu-latest
    environment: management
    if: github.event.inputs.action == 'apply'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup SSH for Private Module Access
        env:
          MODULES_REPO_SSH_PRIVATE_KEY: ${{ secrets.MODULES_REPO_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$MODULES_REPO_SSH_PRIVATE_KEY" ]; then
            echo "Missing required secret MODULES_REPO_SSH_PRIVATE_KEY in this GitHub Environment."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$MODULES_REPO_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Validate Requested Subscription ID
        if: ${{ github.event.inputs.expected_subscription_id != '' }}
        run: |
          REQUESTED_SUBSCRIPTION_ID="${{ github.event.inputs.expected_subscription_id }}"
          ACTUAL_SUBSCRIPTION_ID="${{ secrets.ARM_SUBSCRIPTION_ID }}"

          if [ "${REQUESTED_SUBSCRIPTION_ID,,}" != "${ACTUAL_SUBSCRIPTION_ID,,}" ]; then
            echo "Requested subscription ID does not match management workflow subscription ID."
            echo "Requested: ${REQUESTED_SUBSCRIPTION_ID}"
            echo "Actual: ${ACTUAL_SUBSCRIPTION_ID}"
            exit 1
          fi

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-management
          path: ./alz-platform/pattern1/management

      - name: Terraform Init
        working-directory: ./alz-platform/pattern1/management
        env:
          ARM_USE_OIDC: true
          ARM_OIDC_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ARM_OIDC_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
        run: terraform init -backend-config="backend.tfvars"

      - name: Terraform Apply
        timeout-minutes: 60
        working-directory: ./alz-platform/pattern1/management
        env:
          ARM_USE_OIDC: true
          ARM_OIDC_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ARM_OIDC_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
        run: |
          if [ -f "tfplan-management" ]; then
            terraform apply -auto-approve "tfplan-management"
          else
            echo "❌ Plan file not found. Skipping apply."
            exit 1
          fi

  terraform-destroy:
    needs: approval
    runs-on: ubuntu-latest
    environment: management
    if: github.event.inputs.action == 'destroy'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup SSH for Private Module Access
        env:
          MODULES_REPO_SSH_PRIVATE_KEY: ${{ secrets.MODULES_REPO_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$MODULES_REPO_SSH_PRIVATE_KEY" ]; then
            echo "Missing required secret MODULES_REPO_SSH_PRIVATE_KEY in this GitHub Environment."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$MODULES_REPO_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Validate Requested Subscription ID
        if: ${{ github.event.inputs.expected_subscription_id != '' }}
        run: |
          REQUESTED_SUBSCRIPTION_ID="${{ github.event.inputs.expected_subscription_id }}"
          ACTUAL_SUBSCRIPTION_ID="${{ secrets.ARM_SUBSCRIPTION_ID }}"

          if [ "${REQUESTED_SUBSCRIPTION_ID,,}" != "${ACTUAL_SUBSCRIPTION_ID,,}" ]; then
            echo "Requested subscription ID does not match management workflow subscription ID."
            echo "Requested: ${REQUESTED_SUBSCRIPTION_ID}"
            echo "Actual: ${ACTUAL_SUBSCRIPTION_ID}"
            exit 1
          fi

      - name: Terraform Init
        working-directory: ./alz-platform/pattern1/management
        env:
          ARM_USE_OIDC: true
          ARM_OIDC_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ARM_OIDC_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
        run: terraform init -backend-config="backend.tfvars"

      - name: Terraform Destroy
        timeout-minutes: 60
        working-directory: ./alz-platform/pattern1/management
        env:
          ARM_USE_OIDC: true
          ARM_OIDC_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ARM_OIDC_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
        run: |
          TFVARS_FILE="${{ github.workspace }}/alz-platform/pattern1/management/management.tfvars"

          if [ ! -f "$TFVARS_FILE" ]; then
            echo "❌ tfvars file not found: $TFVARS_FILE"
            exit 1
          fi

          terraform destroy -auto-approve -var-file="$TFVARS_FILE"

  deployment-summary:
    needs: terraform-plan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && always()
    steps:
      - name: Generate Deployment Summary
        run: |
          echo "## 🎯 ALZ Management Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
