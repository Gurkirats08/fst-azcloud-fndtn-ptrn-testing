name: ALZ Shared Services CD

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Select shared services region/subscription'
        required: true
        default: 'ase'
        type: choice
        options:
          - ase
          - inc
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
      expected_subscription_id:
        description: 'Expected Azure Subscription ID for safety validation'
        required: false
        type: string

env:
  TERRAFORM_VERSION: "1.6.0"
  TF_INPUT: false
  TF_IN_AUTOMATION: true

permissions:
  id-token: write
  contents: read

jobs:
  resolve-region:
    if: github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    outputs:
      region: ${{ steps.resolve.outputs.region }}
      environment_name: ${{ steps.resolve.outputs.environment_name }}
      terraform_root: ${{ steps.resolve.outputs.terraform_root }}
      tfvars_file: ${{ steps.resolve.outputs.tfvars_file }}
      plan_file: ${{ steps.resolve.outputs.plan_file }}
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}
    steps:
      - name: Resolve region settings
        id: resolve
        shell: bash
        run: |
          REGION="${{ github.event.inputs.region }}"
          ENVIRONMENT_NAME="${REGION}-shared"

          echo "region=${REGION}" >> "$GITHUB_OUTPUT"
          echo "environment_name=${ENVIRONMENT_NAME}" >> "$GITHUB_OUTPUT"
          echo "terraform_root=./alz-platform/${REGION}/sharedservices" >> "$GITHUB_OUTPUT"
          echo "tfvars_file=${GITHUB_WORKSPACE}/alz-platform/${REGION}/sharedservices/sharedservices.tfvars" >> "$GITHUB_OUTPUT"
          echo "plan_file=tfplan-sharedservices-${REGION}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=tfplan-sharedservices-${REGION}" >> "$GITHUB_OUTPUT"

  bootstrap:
    needs: resolve-region
    if: github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'master')
    uses: ./.github/workflows/bootstrap-sharedservices.yml
    with:
      region: ${{ needs.resolve-region.outputs.region }}
      environment: ${{ needs.resolve-region.outputs.environment_name }}
      expected_subscription_id: ${{ github.event.inputs.expected_subscription_id }}
    secrets: inherit

  terraform-plan:
    needs:
      - resolve-region
      - bootstrap
    if: github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-region.outputs.environment_name }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH for Private Module Access
        env:
          MODULES_REPO_SSH_PRIVATE_KEY: ${{ secrets.MODULES_REPO_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$MODULES_REPO_SSH_PRIVATE_KEY" ]; then
            echo "Missing required secret MODULES_REPO_SSH_PRIVATE_KEY in GitHub Environment '${{ needs.resolve-region.outputs.environment_name }}'."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$MODULES_REPO_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate Required ARM Secrets
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          MISSING_SECRETS=""
          if [ -z "$ARM_CLIENT_ID" ]; then MISSING_SECRETS="$MISSING_SECRETS ARM_CLIENT_ID"; fi
          if [ -z "$ARM_TENANT_ID" ]; then MISSING_SECRETS="$MISSING_SECRETS ARM_TENANT_ID"; fi
          if [ -z "$ARM_SUBSCRIPTION_ID" ]; then MISSING_SECRETS="$MISSING_SECRETS ARM_SUBSCRIPTION_ID"; fi
          if [ -n "$MISSING_SECRETS" ]; then
            echo "Missing required secrets in GitHub Environment '${{ needs.resolve-region.outputs.environment_name }}':$MISSING_SECRETS"
            exit 1
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Validate Requested Subscription ID
        if: ${{ github.event.inputs.expected_subscription_id != '' }}
        run: |
          REQUESTED_SUBSCRIPTION_ID="${{ github.event.inputs.expected_subscription_id }}"
          ACTUAL_SUBSCRIPTION_ID="${{ secrets.ARM_SUBSCRIPTION_ID }}"
          if [ "${REQUESTED_SUBSCRIPTION_ID,,}" != "${ACTUAL_SUBSCRIPTION_ID,,}" ]; then
            echo "Requested subscription ID does not match shared services workflow subscription ID."
            echo "Requested: ${REQUESTED_SUBSCRIPTION_ID}"
            echo "Actual: ${ACTUAL_SUBSCRIPTION_ID}"
            exit 1
          fi

      - name: Terraform Init
        working-directory: ${{ needs.resolve-region.outputs.terraform_root }}
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_environment: ${{ needs.resolve-region.outputs.environment_name }}
        run: |
          terraform init \
            -backend-config="backend.tfvars" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform Format
        working-directory: ${{ needs.resolve-region.outputs.terraform_root }}
        continue-on-error: true
        run: terraform fmt -recursive

      - name: Terraform Validate
        working-directory: ${{ needs.resolve-region.outputs.terraform_root }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ needs.resolve-region.outputs.terraform_root }}
        timeout-minutes: 30
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_environment: ${{ needs.resolve-region.outputs.environment_name }}
        run: |
          export ARM_OIDC_REQUEST_TOKEN="$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          export ARM_OIDC_REQUEST_URL="$ACTIONS_ID_TOKEN_REQUEST_URL"
          TFVARS_FILE="${{ needs.resolve-region.outputs.tfvars_file }}"
          if [ ! -f "$TFVARS_FILE" ]; then
            echo "tfvars file not found: $TFVARS_FILE"
            exit 1
          fi
          echo "Using tfvars file: $TFVARS_FILE"
          MAX_RETRIES=3
          RETRY=0
          while [ $RETRY -lt $MAX_RETRIES ]; do
            echo "Terraform plan attempt $((RETRY + 1))/$MAX_RETRIES"
            terraform plan \
              -var-file="$TFVARS_FILE" \
              -out="${{ needs.resolve-region.outputs.plan_file }}" && break
            RETRY=$((RETRY + 1))
            if [ $RETRY -lt $MAX_RETRIES ]; then
              echo "Plan failed, waiting 30 seconds before retry..."
              sleep 30
            fi
          done
          if [ $RETRY -eq $MAX_RETRIES ]; then
            echo "Failed to acquire state lock after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve-region.outputs.artifact_name }}
          path: ${{ needs.resolve-region.outputs.terraform_root }}/${{ needs.resolve-region.outputs.plan_file }}
          retention-days: 7

  approval:
    needs:
      - resolve-region
      - terraform-plan
    runs-on: ubuntu-latest
    if: needs.terraform-plan.result == 'success' && (github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy')
    environment:
      name: ${{ needs.resolve-region.outputs.environment_name }}
    steps:
      - name: Approval Checkpoint
        run: |
          echo "Approval granted for shared services deployment to ${{ needs.resolve-region.outputs.environment_name }}"

  terraform-apply:
    needs:
      - resolve-region
      - approval
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-region.outputs.environment_name }}
    if: needs.approval.result == 'success' && github.event.inputs.action == 'apply'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH for Private Module Access
        env:
          MODULES_REPO_SSH_PRIVATE_KEY: ${{ secrets.MODULES_REPO_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$MODULES_REPO_SSH_PRIVATE_KEY" ]; then
            echo "Missing required secret MODULES_REPO_SSH_PRIVATE_KEY in GitHub Environment '${{ needs.resolve-region.outputs.environment_name }}'."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$MODULES_REPO_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate Required ARM Secrets
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          MISSING_SECRETS=""
          if [ -z "$ARM_CLIENT_ID" ]; then MISSING_SECRETS="$MISSING_SECRETS ARM_CLIENT_ID"; fi
          if [ -z "$ARM_TENANT_ID" ]; then MISSING_SECRETS="$MISSING_SECRETS ARM_TENANT_ID"; fi
          if [ -z "$ARM_SUBSCRIPTION_ID" ]; then MISSING_SECRETS="$MISSING_SECRETS ARM_SUBSCRIPTION_ID"; fi
          if [ -n "$MISSING_SECRETS" ]; then
            echo "Missing required secrets in GitHub Environment '${{ needs.resolve-region.outputs.environment_name }}':$MISSING_SECRETS"
            exit 1
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Validate Requested Subscription ID
        if: ${{ github.event.inputs.expected_subscription_id != '' }}
        run: |
          REQUESTED_SUBSCRIPTION_ID="${{ github.event.inputs.expected_subscription_id }}"
          ACTUAL_SUBSCRIPTION_ID="${{ secrets.ARM_SUBSCRIPTION_ID }}"
          if [ "${REQUESTED_SUBSCRIPTION_ID,,}" != "${ACTUAL_SUBSCRIPTION_ID,,}" ]; then
            echo "Requested subscription ID does not match shared services workflow subscription ID."
            echo "Requested: ${REQUESTED_SUBSCRIPTION_ID}"
            echo "Actual: ${ACTUAL_SUBSCRIPTION_ID}"
            exit 1
          fi

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve-region.outputs.artifact_name }}
          path: ${{ needs.resolve-region.outputs.terraform_root }}

      - name: Terraform Init
        working-directory: ${{ needs.resolve-region.outputs.terraform_root }}
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_environment: ${{ needs.resolve-region.outputs.environment_name }}
        run: |
          terraform init \
            -backend-config="backend.tfvars" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform Apply
        timeout-minutes: 60
        working-directory: ${{ needs.resolve-region.outputs.terraform_root }}
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_environment: ${{ needs.resolve-region.outputs.environment_name }}
        run: |
          export ARM_OIDC_REQUEST_TOKEN="$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          export ARM_OIDC_REQUEST_URL="$ACTIONS_ID_TOKEN_REQUEST_URL"
          if [ -f "${{ needs.resolve-region.outputs.plan_file }}" ]; then
            terraform apply -auto-approve "${{ needs.resolve-region.outputs.plan_file }}"
          else
            echo "Plan file not found. Skipping apply."
            exit 1
          fi

  deployment-summary:
    needs:
      - resolve-region
      - terraform-plan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'master') && always()
    steps:
      - name: Generate Deployment Summary
        run: |
          echo "## ALZ Shared Services Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ needs.resolve-region.outputs.region }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.resolve-region.outputs.environment_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY