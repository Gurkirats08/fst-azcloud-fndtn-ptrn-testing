name: ALZ Shared Services CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      region:
        description: "Select shared services region/subscription"
        required: true
        default: ase
        type: choice
        options:
          - ase
          - inc
      environment:
        description: "GitHub environment to use for secrets"
        required: true
        default: ase-shared
        type: string
      expected_subscription_id:
        description: "Expected Azure Subscription ID for safety validation"
        required: false
        type: string

env:
  TERRAFORM_VERSION: "1.6.0"
  TF_INPUT: false
  TF_IN_AUTOMATION: true

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  validate-labels:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR has required labels
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels) }}'
          echo "PR Labels: $LABELS"
          
          HAS_REQUIRED_LABEL="false"
          
          # Use regex to match label names with flexible spacing in JSON
          if echo "$LABELS" | grep -qE '"name"\s*:\s*"(ase-shared|inc-shared)"'; then
            HAS_REQUIRED_LABEL="true"
          fi
          
          if [ "$HAS_REQUIRED_LABEL" = "false" ]; then
            echo "❌ ERROR: PR must have at least one of these labels to proceed:"
            echo "  - ase-shared (for ASE region testing)"
            echo "  - inc-shared (for INC region testing)"
            echo ""
            echo "Please add a label to this PR before it can be merged."
            exit 1
          fi
          
          echo "✅ PR has required label(s) for CI"

  detect-regions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_regions: ${{ steps.detect.outputs.has_regions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect shared services regions from PR labels
        id: detect
        shell: bash
        run: |
          MATRIX="[]"
          HAS_REGIONS="false"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Workflow dispatch uses manual input
            REGION="${{ github.event.inputs.region }}"
            ENVIRONMENT_NAME="${REGION}-shared"
            MATRIX="[{\"region\":\"${REGION}\",\"environment\":\"${ENVIRONMENT_NAME}\"}]"
            HAS_REGIONS="true"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # Extract labels from PR
            LABELS='${{ toJSON(github.event.pull_request.labels) }}'
            echo "PR Labels: $LABELS"
            
            HAS_ASE="false"
            HAS_INC="false"
            
            # Check if PR has required labels (using regex for flexible JSON formatting)
            if echo "$LABELS" | grep -qE '"name"\s*:\s*"ase-shared"'; then
              HAS_ASE="true"
            fi
            
            if echo "$LABELS" | grep -qE '"name"\s*:\s*"inc-shared"'; then
              HAS_INC="true"
            fi
            
            # Require at least one label
            if [ "$HAS_ASE" = "false" ] && [ "$HAS_INC" = "false" ]; then
              echo "ERROR: PR must have at least one label: 'ase-shared' or 'inc-shared'"
              echo "PR has no relevant labels and cannot proceed."
              HAS_REGIONS="false"
            elif [ "$HAS_ASE" = "true" ] && [ "$HAS_INC" = "true" ]; then
              MATRIX="[{\"region\":\"ase\",\"environment\":\"ase-shared\"},{\"region\":\"inc\",\"environment\":\"inc-shared\"}]"
              HAS_REGIONS="true"
            elif [ "$HAS_ASE" = "true" ]; then
              MATRIX="[{\"region\":\"ase\",\"environment\":\"ase-shared\"}]"
              HAS_REGIONS="true"
            elif [ "$HAS_INC" = "true" ]; then
              MATRIX="[{\"region\":\"inc\",\"environment\":\"inc-shared\"}]"
              HAS_REGIONS="true"
            fi
          fi

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "has_regions=${HAS_REGIONS}" >> "$GITHUB_OUTPUT"

  bootstrap:
    needs: detect-regions
    if: needs.detect-regions.outputs.has_regions == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-regions.outputs.matrix) }}
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Required ARM Secrets
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          MISSING_SECRETS=""
          if [ -z "$ARM_CLIENT_ID" ]; then MISSING_SECRETS="$MISSING_SECRETS ARM_CLIENT_ID"; fi
          if [ -z "$ARM_TENANT_ID" ]; then MISSING_SECRETS="$MISSING_SECRETS ARM_TENANT_ID"; fi
          if [ -z "$ARM_SUBSCRIPTION_ID" ]; then MISSING_SECRETS="$MISSING_SECRETS ARM_SUBSCRIPTION_ID"; fi
          if [ -n "$MISSING_SECRETS" ]; then
            echo "Missing required secrets in GitHub Environment '${{ matrix.environment }}':$MISSING_SECRETS"
            exit 1
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Bootstrap - Create backend resource group if missing
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          TFVARS="./alz-platform/${{ matrix.region }}/sharedservices/backend.tfvars"
          CONFIG="./alz-platform/${{ matrix.region }}/sharedservices/sharedservices.tfvars"
          RESOURCE_GROUP=$(awk -F '"' '/resource_group_name/ {print $2}' "$TFVARS")
          LOCATION=$(awk -F '"' '/^mainLocation/ {print $2}' "$CONFIG" | head -n1)
          if [ -z "$LOCATION" ]; then
            echo "Unable to determine RG location from $CONFIG"
            exit 1
          fi
          GROUP_EXISTS=$(az group exists --name "$RESOURCE_GROUP" --only-show-errors)
          if [ "$GROUP_EXISTS" != "true" ]; then
            echo "Creating resource group $RESOURCE_GROUP in $LOCATION"
            az group create \
              --name "$RESOURCE_GROUP" \
              --location "$LOCATION" \
              --only-show-errors
          else
            echo "Resource group $RESOURCE_GROUP already exists."
          fi

      - name: Bootstrap - Create Storage Account and Blob Container
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          TFVARS="./alz-platform/${{ matrix.region }}/sharedservices/backend.tfvars"
          RESOURCE_GROUP=$(awk -F '"' '/resource_group_name/ {print $2}' "$TFVARS")
          STORAGE_ACCOUNT=$(awk -F '"' '/storage_account_name/ {print $2}' "$TFVARS")
          CONTAINER=$(awk -F '"' '/container_name/ {print $2}' "$TFVARS")
          LOCATION=$(az group show --name "$RESOURCE_GROUP" --query location -o tsv)
          echo "Bootstrapping: $STORAGE_ACCOUNT/$CONTAINER in $RESOURCE_GROUP ($LOCATION)"
          if ! az storage account show --name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" --only-show-errors &>/dev/null; then
            az storage account create \
              --name "$STORAGE_ACCOUNT" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$LOCATION" \
              --sku Standard_LRS \
              --kind StorageV2 \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access true \
              --only-show-errors
          else
            echo "Storage account $STORAGE_ACCOUNT already exists, skipping."
          fi
          CONTAINER_CREATED=false
          for i in {1..10}; do
            if az storage container show --name "$CONTAINER" --account-name "$STORAGE_ACCOUNT" --auth-mode login --only-show-errors &>/dev/null; then
              echo "Blob container $CONTAINER already exists, skipping."
              CONTAINER_CREATED=true
              break
            fi
            if [ $i -eq 1 ]; then
              echo "Creating blob container $CONTAINER in $STORAGE_ACCOUNT..."
            fi
            if az storage container create \
              --name "$CONTAINER" \
              --account-name "$STORAGE_ACCOUNT" \
              --auth-mode login \
              --only-show-errors &>/dev/null; then
              echo "Blob container $CONTAINER created successfully."
              CONTAINER_CREATED=true
              break
            else
              if [ $i -lt 10 ]; then
                echo "Attempt $i/10: Container creation failed, retrying in 10 seconds..."
                sleep 10
              else
                echo "Attempt $i/10: Container creation failed. Aborting after 10 attempts."
              fi
            fi
          done
          if [ "$CONTAINER_CREATED" = false ]; then
            echo "Failed to create blob container $CONTAINER after 10 attempts."
            exit 1
          fi

      - name: Bootstrap - Grant Storage Blob Data Contributor to SPN
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          TFVARS="./alz-platform/${{ matrix.region }}/sharedservices/backend.tfvars"
          RESOURCE_GROUP=$(awk -F '"' '/resource_group_name/ {print $2}' "$TFVARS")
          STORAGE_ACCOUNT=$(awk -F '"' '/storage_account_name/ {print $2}' "$TFVARS")
          STORAGE_ID=$(az storage account show \
            --name "$STORAGE_ACCOUNT" \
            --resource-group "$RESOURCE_GROUP" \
            --query id -o tsv)
          SP_OBJECT_ID=$(az ad sp show --id "$ARM_CLIENT_ID" --query id -o tsv)
          if [ -z "$SP_OBJECT_ID" ]; then
            echo "ERROR: Could not resolve Service Principal object ID for client ID: $ARM_CLIENT_ID"
            exit 1
          fi
          EXISTING=$(az role assignment list \
            --assignee "$SP_OBJECT_ID" \
            --role "Storage Blob Data Contributor" \
            --scope "$STORAGE_ID" \
            --query "[].id" -o tsv 2>/dev/null)
          if [ -z "$EXISTING" ]; then
            echo "Granting Storage Blob Data Contributor on: $STORAGE_ID"
            az role assignment create \
              --assignee-object-id "$SP_OBJECT_ID" \
              --assignee-principal-type ServicePrincipal \
              --role "Storage Blob Data Contributor" \
              --scope "$STORAGE_ID" \
              --only-show-errors
            echo "Role assignment created. Verifying data-plane access in the next step."
          else
            echo "Storage Blob Data Contributor already assigned, skipping."
          fi

      - name: Validate Backend Blob Access
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          TFVARS="./alz-platform/${{ matrix.region }}/sharedservices/backend.tfvars"
          STORAGE_ACCOUNT_NAME=$(awk -F '"' '/storage_account_name/ {print $2}' "$TFVARS")
          CONTAINER_NAME=$(awk -F '"' '/container_name/ {print $2}' "$TFVARS")
          if [ -z "$STORAGE_ACCOUNT_NAME" ] || [ -z "$CONTAINER_NAME" ]; then
            echo "Unable to parse storage_account_name/container_name from backend.tfvars"
            exit 1
          fi
          echo "Backend storage account and container validated successfully."
          echo "Storage Account: $STORAGE_ACCOUNT_NAME"
          echo "Container: $CONTAINER_NAME"

  terraform-plan-ci:
    needs: [validate-labels, detect-regions, bootstrap]
    if: |
      needs.detect-regions.outputs.has_regions == 'true' &&
      (github.event_name != 'pull_request' || needs.validate-labels.result == 'success')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-regions.outputs.matrix) }}
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PAT Auth for Private Module Access
        env:
          GOLDREPO_PAT: ${{ secrets.GOLDREPO_PAT }}
        run: |
          if [ -z "$GOLDREPO_PAT" ]; then
            echo "Missing required secret GOLDREPO_PAT in GitHub Environment '${{ matrix.environment }}'."
            exit 1
          fi
          echo "GOLDREPO_PAT is set."

      - name: Verify PAT can access gold repo
        env:
          GOLDREPO_PAT: ${{ secrets.GOLDREPO_PAT }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${GOLDREPO_PAT}" \
            https://api.github.com/repos/Gurkirats08/fst-azcloud-goldrepo-testing)
          echo "GitHub API response status: ${STATUS}"
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: PAT cannot access gold repo (HTTP ${STATUS}). Check that GOLDREPO_PAT has 'repo' scope (classic) or 'Contents: Read' for fst-azcloud-goldrepo-testing (fine-grained)."
            exit 1
          fi
          echo "PAT access verified successfully."

      - name: Checkout gold repo for local Terraform modules
        uses: actions/checkout@v4
        with:
          repository: Gurkirats08/fst-azcloud-goldrepo-testing
          ref: main
          token: ${{ secrets.GOLDREPO_PAT }}
          path: goldrepo
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ./alz-platform/${{ matrix.region }}/sharedservices
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_environment: ${{ matrix.environment }}
        run: |
          export ARM_OIDC_REQUEST_TOKEN="$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          export ARM_OIDC_REQUEST_URL="$ACTIONS_ID_TOKEN_REQUEST_URL"
          terraform init \
            -backend-config="backend.tfvars" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform Validate
        working-directory: ./alz-platform/${{ matrix.region }}/sharedservices
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./alz-platform/${{ matrix.region }}/sharedservices
        timeout-minutes: 30
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_environment: ${{ matrix.environment }}
        run: |
          export ARM_OIDC_REQUEST_TOKEN="$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          export ARM_OIDC_REQUEST_URL="$ACTIONS_ID_TOKEN_REQUEST_URL"
          TFVARS_FILE="${{ github.workspace }}/alz-platform/${{ matrix.region }}/sharedservices/sharedservices.tfvars"
          if [ ! -f "$TFVARS_FILE" ]; then
            echo "tfvars file not found: $TFVARS_FILE"
            exit 1
          fi
          echo "Using tfvars file: $TFVARS_FILE"
          terraform plan \
            -var-file="$TFVARS_FILE" \
            -out="tfplan-sharedservices-${{ matrix.region }}"

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-sharedservices-${{ matrix.region }}-ci
          path: ./alz-platform/${{ matrix.region }}/sharedservices/tfplan-sharedservices-${{ matrix.region }}
          retention-days: 7