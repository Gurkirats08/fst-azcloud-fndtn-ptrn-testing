name: ALZ CI Template

on:
  workflow_call:
    inputs:
      stack_name:
        description: Stack name for reporting
        required: true
        type: string
      stack_path:
        description: Terraform working directory for the stack
        required: true
        type: string
      environment_name:
        description: GitHub Environment name to use for environment-scoped secrets
        required: true
        type: string

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.6.0"
  TF_INPUT: false
  TF_IN_AUTOMATION: true

jobs:
  terraform-quality:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH for Private Module Access
        env:
          MODULES_REPO_SSH_PRIVATE_KEY: ${{ secrets.MODULES_REPO_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$MODULES_REPO_SSH_PRIVATE_KEY" ]; then
            echo "Missing required secret MODULES_REPO_SSH_PRIVATE_KEY."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$MODULES_REPO_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check (${{ inputs.stack_name }})
        working-directory: ${{ inputs.stack_path }}
        run: terraform fmt -check -recursive

      - name: Terraform Init (Backend Disabled) (${{ inputs.stack_name }})
        working-directory: ${{ inputs.stack_path }}
        run: terraform init -backend=false

      - name: Terraform Validate (${{ inputs.stack_name }})
        working-directory: ${{ inputs.stack_path }}
        run: terraform validate
