name: ALZ Shared Services Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Environment'
        required: true
        default: 'shared'
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      expected_subscription_id:
        description: 'Expected Azure Subscription ID for safety validation'
        required: false
        type: string

env:
  TERRAFORM_VERSION: "1.6.0"
  TF_INPUT: false
  TF_IN_AUTOMATION: true

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/bootstrap-sharedservices.yml
    with:
      environment: ${{ github.event.inputs.environment }}
      expected_subscription_id: ${{ github.event.inputs.expected_subscription_id }}
    secrets: inherit

  terraform-plan:
    if: github.event_name == 'workflow_dispatch'
    needs: bootstrap
    runs-on: ubuntu-latest
    environment: shared
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup SSH for Private Module Access
        env:
          MODULES_REPO_SSH_PRIVATE_KEY: ${{ secrets.MODULES_REPO_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$MODULES_REPO_SSH_PRIVATE_KEY" ]; then
            echo "Missing required secret MODULES_REPO_SSH_PRIVATE_KEY in this GitHub Environment."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$MODULES_REPO_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate Required ARM Secrets
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          MISSING_SECRETS=""
          if [ -z "$ARM_CLIENT_ID" ]; then MISSING_SECRETS="$MISSING_SECRETS ARM_CLIENT_ID"; fi
          if [ -z "$ARM_TENANT_ID" ]; then MISSING_SECRETS="$MISSING_SECRETS ARM_TENANT_ID"; fi
          if [ -z "$ARM_SUBSCRIPTION_ID" ]; then MISSING_SECRETS="$MISSING_SECRETS ARM_SUBSCRIPTION_ID"; fi
          if [ -n "$MISSING_SECRETS" ]; then
            echo "Missing required secrets in GitHub Environment 'shared':$MISSING_SECRETS"
            exit 1
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Validate Requested Subscription ID
        if: ${{ github.event.inputs.expected_subscription_id != '' }}
        run: |
          REQUESTED_SUBSCRIPTION_ID="${{ github.event.inputs.expected_subscription_id }}"
          ACTUAL_SUBSCRIPTION_ID="${{ secrets.ARM_SUBSCRIPTION_ID }}"
          if [ "${REQUESTED_SUBSCRIPTION_ID,,}" != "${ACTUAL_SUBSCRIPTION_ID,,}" ]; then
            echo "Requested subscription ID does not match shared services workflow subscription ID."
            echo "Requested: ${REQUESTED_SUBSCRIPTION_ID}"
            echo "Actual: ${ACTUAL_SUBSCRIPTION_ID}"
            exit 1
          fi

      - name: Terraform Init
        working-directory: ./alz-platform/pattern1/sharedservices
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
        run: |
          terraform init \
            -backend-config="backend.tfvars" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform Format
        working-directory: ./alz-platform/pattern1/sharedservices
        continue-on-error: true
        run: terraform fmt -recursive

      - name: Terraform Validate
        working-directory: ./alz-platform/pattern1/sharedservices
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./alz-platform/pattern1/sharedservices
        timeout-minutes: 30
        env:
          ARM_USE_OIDC: true
          ARM_OIDC_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ARM_OIDC_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
        run: |
          TFVARS_FILE="${{ github.workspace }}/alz-platform/pattern1/sharedservices/sharedservices.tfvars"
          if [ ! -f "$TFVARS_FILE" ]; then
            echo "tfvars file not found: $TFVARS_FILE"
            exit 1
          fi
          echo "Using tfvars file: $TFVARS_FILE"
          MAX_RETRIES=3
          RETRY=0
          while [ $RETRY -lt $MAX_RETRIES ]; do
            echo "Terraform plan attempt $((RETRY + 1))/$MAX_RETRIES"
            terraform plan \
              -var-file="$TFVARS_FILE" \
              -out=tfplan-sharedservices && break
            RETRY=$((RETRY + 1))
            if [ $RETRY -lt $MAX_RETRIES ]; then
              echo "Plan failed, waiting 30 seconds before retry..."
              sleep 30
            fi
          done
          if [ $RETRY -eq $MAX_RETRIES ]; then
            echo "Failed to acquire state lock after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-sharedservices
          path: ./alz-platform/pattern1/sharedservices/tfplan-sharedservices
          retention-days: 7

  approval:
    needs: terraform-plan
    runs-on: ubuntu-latest
    if: needs.terraform-plan.result == 'success' && (github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy')
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - name: Approval Checkpoint
        run: |
          echo "Approval granted for shared services deployment to ${{ github.event.inputs.environment }}"

  terraform-apply:
    needs: approval
    runs-on: ubuntu-latest
    environment: shared
    if: needs.approval.result == 'success' && github.event.inputs.action == 'apply'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup SSH for Private Module Access
        env:
          MODULES_REPO_SSH_PRIVATE_KEY: ${{ secrets.MODULES_REPO_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$MODULES_REPO_SSH_PRIVATE_KEY" ]; then
            echo "Missing required secret MODULES_REPO_SSH_PRIVATE_KEY in this GitHub Environment."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$MODULES_REPO_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate Required ARM Secrets
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          MISSING_SECRETS=""
          if [ -z "$ARM_CLIENT_ID" ]; then MISSING_SECRETS="$MISSING_SECRETS ARM_CLIENT_ID"; fi
          if [ -z "$ARM_TENANT_ID" ]; then MISSING_SECRETS="$MISSING_SECRETS ARM_TENANT_ID"; fi
          if [ -z "$ARM_SUBSCRIPTION_ID" ]; then MISSING_SECRETS="$MISSING_SECRETS ARM_SUBSCRIPTION_ID"; fi
          if [ -n "$MISSING_SECRETS" ]; then
            echo "Missing required secrets in GitHub Environment 'shared':$MISSING_SECRETS"
            exit 1
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Validate Requested Subscription ID
        if: ${{ github.event.inputs.expected_subscription_id != '' }}
        run: |
          REQUESTED_SUBSCRIPTION_ID="${{ github.event.inputs.expected_subscription_id }}"
          ACTUAL_SUBSCRIPTION_ID="${{ secrets.ARM_SUBSCRIPTION_ID }}"
          if [ "${REQUESTED_SUBSCRIPTION_ID,,}" != "${ACTUAL_SUBSCRIPTION_ID,,}" ]; then
            echo "Requested subscription ID does not match shared services workflow subscription ID."
            echo "Requested: ${REQUESTED_SUBSCRIPTION_ID}"
            echo "Actual: ${ACTUAL_SUBSCRIPTION_ID}"
            exit 1
          fi

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-sharedservices
          path: ./alz-platform/pattern1/sharedservices

      - name: Terraform Init
        working-directory: ./alz-platform/pattern1/sharedservices
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
        run: |
          terraform init \
            -backend-config="backend.tfvars" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform Apply
        timeout-minutes: 60
        working-directory: ./alz-platform/pattern1/sharedservices
        env:
          ARM_USE_OIDC: true
          ARM_OIDC_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ARM_OIDC_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
        run: |
          if [ -f "tfplan-sharedservices" ]; then
            terraform apply -auto-approve "tfplan-sharedservices"
          else
            echo "Plan file not found. Skipping apply."
            exit 1
          fi

  terraform-destroy:
    needs: approval
    runs-on: ubuntu-latest
    environment: shared
    if: needs.approval.result == 'success' && github.event.inputs.action == 'destroy'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup SSH for Private Module Access
        env:
          MODULES_REPO_SSH_PRIVATE_KEY: ${{ secrets.MODULES_REPO_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$MODULES_REPO_SSH_PRIVATE_KEY" ]; then
            echo "Missing required secret MODULES_REPO_SSH_PRIVATE_KEY in this GitHub Environment."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$MODULES_REPO_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate Required ARM Secrets
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          MISSING_SECRETS=""
          if [ -z "$ARM_CLIENT_ID" ]; then MISSING_SECRETS="$MISSING_SECRETS ARM_CLIENT_ID"; fi
          if [ -z "$ARM_TENANT_ID" ]; then MISSING_SECRETS="$MISSING_SECRETS ARM_TENANT_ID"; fi
          if [ -z "$ARM_SUBSCRIPTION_ID" ]; then MISSING_SECRETS="$MISSING_SECRETS ARM_SUBSCRIPTION_ID"; fi
          if [ -n "$MISSING_SECRETS" ]; then
            echo "Missing required secrets in GitHub Environment 'shared':$MISSING_SECRETS"
            exit 1
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Validate Requested Subscription ID
        if: ${{ github.event.inputs.expected_subscription_id != '' }}
        run: |
          REQUESTED_SUBSCRIPTION_ID="${{ github.event.inputs.expected_subscription_id }}"
          ACTUAL_SUBSCRIPTION_ID="${{ secrets.ARM_SUBSCRIPTION_ID }}"
          if [ "${REQUESTED_SUBSCRIPTION_ID,,}" != "${ACTUAL_SUBSCRIPTION_ID,,}" ]; then
            echo "Requested subscription ID does not match shared services workflow subscription ID."
            echo "Requested: ${REQUESTED_SUBSCRIPTION_ID}"
            echo "Actual: ${ACTUAL_SUBSCRIPTION_ID}"
            exit 1
          fi

      - name: Terraform Init
        working-directory: ./alz-platform/pattern1/sharedservices
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
        run: |
          terraform init \
            -backend-config="backend.tfvars" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform Destroy
        timeout-minutes: 60
        working-directory: ./alz-platform/pattern1/sharedservices
        env:
          ARM_USE_OIDC: true
          ARM_OIDC_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ARM_OIDC_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
        run: |
          TFVARS_FILE="${{ github.workspace }}/alz-platform/pattern1/sharedservices/sharedservices.tfvars"
          if [ ! -f "$TFVARS_FILE" ]; then
            echo "tfvars file not found: $TFVARS_FILE"
            exit 1
          fi
          terraform destroy -auto-approve -var-file="$TFVARS_FILE"

  deployment-summary:
    needs: terraform-plan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && always()
    steps:
      - name: Generate Deployment Summary
        run: |
          echo "## ALZ Shared Services Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY