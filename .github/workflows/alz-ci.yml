name: ALZ Terraform CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review
    paths:
      - "alz-platform/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      stack:
        description: "Select subscription stack to validate"
        required: true
        default: sharedservices
        type: choice
        options:
          - connectivity
          - identity
          - management
          - security
          - sharedservices

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.6.0"
  TF_INPUT: false
  TF_IN_AUTOMATION: true

jobs:
  detect-pr-stacks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed stacks
        id: detect
        shell: bash
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          SELECTED_STACK=""
          SELECTED_COUNT=0

          for label in connectivity identity management security sharedservices; do
            if echo " $PR_LABELS " | grep -q " ci:${label} "; then
              SELECTED_STACK="$label"
              SELECTED_COUNT=$((SELECTED_COUNT + 1))
            fi
          done

          if [ "$SELECTED_COUNT" -gt 1 ]; then
            echo "Only one CI stack label is allowed on a PR."
            echo "Use exactly one of: ci:connectivity, ci:identity, ci:management, ci:security, ci:sharedservices"
            exit 1
          fi

          if [ "$SELECTED_COUNT" -eq 1 ]; then
            case "$SELECTED_STACK" in
              connectivity)
                MATRIX='{"stack":[{"name":"connectivity","path":"./alz-platform/pattern1/connectivity"}]}'
                ;;
              identity)
                MATRIX='{"stack":[{"name":"identity","path":"./alz-platform/pattern1/identity_dev"}]}'
                ;;
              management)
                MATRIX='{"stack":[{"name":"management","path":"./alz-platform/pattern1/management"}]}'
                ;;
              security)
                MATRIX='{"stack":[{"name":"security","path":"./alz-platform/pattern1/security"}]}'
                ;;
              sharedservices)
                MATRIX='{"stack":[{"name":"sharedservices","path":"./alz-platform/pattern1/sharedservices"}]}'
                ;;
            esac
            echo "PR label selected stack: $SELECTED_STACK"
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          INCLUDE_CONNECTIVITY=false
          INCLUDE_IDENTITY=false
          INCLUDE_MANAGEMENT=false
          INCLUDE_SECURITY=false
          INCLUDE_SHAREDSERVICES=false
          INCLUDE_ALL=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              .github/workflows/*)
                INCLUDE_ALL=true
                ;;
              alz-platform/pattern1/connectivity/*)
                INCLUDE_CONNECTIVITY=true
                ;;
              alz-platform/pattern1/identity_dev/*)
                INCLUDE_IDENTITY=true
                ;;
              alz-platform/pattern1/management/*)
                INCLUDE_MANAGEMENT=true
                ;;
              alz-platform/pattern1/security/*)
                INCLUDE_SECURITY=true
                ;;
              alz-platform/pattern1/sharedservices/*)
                INCLUDE_SHAREDSERVICES=true
                ;;
            esac
          done <<< "$CHANGED_FILES"

          if [ "$INCLUDE_ALL" = true ]; then
            MATRIX='{"stack":[{"name":"connectivity","path":"./alz-platform/pattern1/connectivity"},{"name":"identity","path":"./alz-platform/pattern1/identity_dev"},{"name":"management","path":"./alz-platform/pattern1/management"},{"name":"security","path":"./alz-platform/pattern1/security"},{"name":"sharedservices","path":"./alz-platform/pattern1/sharedservices"}]}'
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STACKS=""
          if [ "$INCLUDE_CONNECTIVITY" = true ]; then
            STACKS='{"name":"connectivity","path":"./alz-platform/pattern1/connectivity"}'
          fi
          if [ "$INCLUDE_IDENTITY" = true ]; then
            if [ -n "$STACKS" ]; then STACKS="$STACKS,"; fi
            STACKS="$STACKS"'{"name":"identity","path":"./alz-platform/pattern1/identity_dev"}'
          fi
          if [ "$INCLUDE_MANAGEMENT" = true ]; then
            if [ -n "$STACKS" ]; then STACKS="$STACKS,"; fi
            STACKS="$STACKS"'{"name":"management","path":"./alz-platform/pattern1/management"}'
          fi
          if [ "$INCLUDE_SECURITY" = true ]; then
            if [ -n "$STACKS" ]; then STACKS="$STACKS,"; fi
            STACKS="$STACKS"'{"name":"security","path":"./alz-platform/pattern1/security"}'
          fi
          if [ "$INCLUDE_SHAREDSERVICES" = true ]; then
            if [ -n "$STACKS" ]; then STACKS="$STACKS,"; fi
            STACKS="$STACKS"'{"name":"sharedservices","path":"./alz-platform/pattern1/sharedservices"}'
          fi

          if [ -z "$STACKS" ]; then
            echo 'matrix={"stack":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "matrix={\"stack\":[${STACKS}]}" >> "$GITHUB_OUTPUT"
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"

  terraform-quality-pr:
    needs: detect-pr-stacks
    if: github.event_name == 'pull_request' && needs.detect-pr-stacks.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-pr-stacks.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH for Private Module Access
        env:
          MODULES_REPO_SSH_PRIVATE_KEY: ${{ secrets.MODULES_REPO_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$MODULES_REPO_SSH_PRIVATE_KEY" ]; then
            echo "Missing required secret MODULES_REPO_SSH_PRIVATE_KEY."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$MODULES_REPO_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check (${{ matrix.stack.name }})
        working-directory: ${{ matrix.stack.path }}
        run: terraform fmt -check -recursive

      - name: Terraform Init (Backend Disabled) (${{ matrix.stack.name }})
        working-directory: ${{ matrix.stack.path }}
        run: terraform init -backend=false

      - name: Terraform Validate (${{ matrix.stack.name }})
        working-directory: ${{ matrix.stack.path }}
        run: terraform validate

  terraform-quality-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      STACK: ${{ github.event.inputs.stack }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH for Private Module Access
        env:
          MODULES_REPO_SSH_PRIVATE_KEY: ${{ secrets.MODULES_REPO_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$MODULES_REPO_SSH_PRIVATE_KEY" ]; then
            echo "Missing required secret MODULES_REPO_SSH_PRIVATE_KEY."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$MODULES_REPO_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Resolve Stack Path
        id: resolve_stack
        run: |
          case "$STACK" in
            connectivity)
              echo "stack_path=./alz-platform/pattern1/connectivity" >> "$GITHUB_OUTPUT"
              ;;
            identity)
              echo "stack_path=./alz-platform/pattern1/identity_dev" >> "$GITHUB_OUTPUT"
              ;;
            management)
              echo "stack_path=./alz-platform/pattern1/management" >> "$GITHUB_OUTPUT"
              ;;
            security)
              echo "stack_path=./alz-platform/pattern1/security" >> "$GITHUB_OUTPUT"
              ;;
            sharedservices)
              echo "stack_path=./alz-platform/pattern1/sharedservices" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported stack: $STACK"
              exit 1
              ;;
          esac
          echo "Running CI checks for stack: $STACK"

      - name: Terraform Format Check
        working-directory: ${{ steps.resolve_stack.outputs.stack_path }}
        run: terraform fmt -check -recursive

      - name: Terraform Init (Backend Disabled)
        working-directory: ${{ steps.resolve_stack.outputs.stack_path }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ steps.resolve_stack.outputs.stack_path }}
        run: terraform validate
